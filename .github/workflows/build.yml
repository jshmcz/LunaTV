name: Build LunaTV Enhanced (去广告增强版)

# 触发方式：
#  1. 手动触发（推荐）—— 在 Actions 页面点 Run workflow，可指定版本
#  2. 上游发布新 tag 时自动触发（需配合 schedule 轮询，见下方 workflow_dispatch 说明）
on:
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的 LunaTV 版本 tag（如 5.1.8）'
        required: true
        default: '5.1.8'
  push:
    tags:
      - 'enhanced-*'   # 推送 enhanced-5.1.8 这类 tag 也会触发

env:
  REGISTRY: ghcr.io
  # 镜像名会自动用 <你的用户名>/<仓库名>，无需手填

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送镜像到 GHCR 需要
    steps:
      # ---------- 1. 拉取官方指定版本源码 ----------
      - name: Checkout 官方源码
        uses: actions/checkout@v4
        with:
          repository: laboratorys/LunaTV
          ref: ${{ github.event.inputs.version || github.ref_name }}
          path: source
          fetch-depth: 0

      # ---------- 2. 拉取本仓库的补丁 ----------
      - name: Checkout 补丁仓库
        uses: actions/checkout@v4
        with:
          path: patches

      # ---------- 3. 应用去广告补丁 ----------
      - name: Apply adfilter patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/apply_patch.sh" "$GITHUB_WORKSPACE/source"
          # 覆盖为带编译工具链的 Dockerfile
          cp "$GITHUB_WORKSPACE/patches/Dockerfile" "$GITHUB_WORKSPACE/source/Dockerfile"

      # ---------- 4. 构建并推送镜像 ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./source
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.event.inputs.version || github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest

      - name: 完成提示
        run: |
          echo "镜像已推送到："
          echo "  ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.event.inputs.version || github.ref_name }}"
          echo "  ${{ env.REGISTRY }}/${{ github.repository }}:latest"
