name: Build LunaTV Enhanced (去广告 + 站长 + TVBox同款去广告)

# 手动触发：在 Actions 页面点 Run workflow，填入要编译的版本号
on:
  workflow_dispatch:
    inputs:
      version:
        description: '官方源码版本 tag（如 5.1.8）。必须是 laboratorys/LunaTV 仓库真实存在的 tag，否则 checkout 会失败'
        required: true
        default: '5.1.8'
      image_tag:
        description: '产出镜像标签（如 5.1.8.3）。留空则与源码版本相同'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送镜像到 GHCR 需要
    steps:
      # ---------- 0. 计算小写镜像名（GHCR/Docker 不允许大写） ----------
      - name: 计算镜像名
        id: img
        run: |
          VER="${{ github.event.inputs.version }}"
          TAG="${{ github.event.inputs.image_tag }}"
          # 镜像标签留空则用源码版本；校验只含合法字符
          [ -z "$TAG" ] && TAG="$VER"
          if ! echo "$TAG" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "ERROR: 镜像标签只能包含字母、数字、点、下划线、连字符" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${OWNER}/lunatv" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "源码版本: ${VER}  镜像目标: ${{ env.REGISTRY }}/${OWNER}/lunatv:${TAG}"

      # ---------- 1. 拉取官方指定版本源码 ----------
      - name: Checkout 官方源码
        uses: actions/checkout@v5
        with:
          repository: laboratorys/LunaTV
          ref: ${{ steps.img.outputs.version }}
          path: source
          fetch-depth: 0

      # ---------- 2. 拉取本仓库的补丁 ----------
      - name: Checkout 补丁仓库
        uses: actions/checkout@v5
        with:
          path: patches

      # ---------- 3. 应用去广告补丁（网页播放） ----------
      - name: Apply adfilter patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/apply_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 4. 应用站长增强补丁 ----------
      - name: Apply owner patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/owner-patch/apply_owner_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 5. 应用 TVBox 同款去广告补丁 ----------
      - name: Apply tvbox-ad patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/tvbox-adpatch/apply_tvbox_ad_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 6. 使用增强版 Dockerfile（含 better-sqlite3 编译工具链） ----------
      - name: Prepare Dockerfile
        run: |
          cp "$GITHUB_WORKSPACE/patches/Dockerfile" "$GITHUB_WORKSPACE/source/Dockerfile"
          echo "--- 校验所有补丁符号 ---"
          grep -q "filterAdsEnhanced" "$GITHUB_WORKSPACE/source/src/lib/pcrAdFilter.ts"
          grep -q "createSession" "$GITHUB_WORKSPACE/source/src/lib/session.ts"
          grep -q "id: 'owner'" "$GITHUB_WORKSPACE/source/src/app/admin/page.tsx"
          grep -q "filterAdsServerSide" "$GITHUB_WORKSPACE/source/src/lib/serverAdFilter.ts"
          grep -q "\[ServerAdFilter\] 启发式命中" "$GITHUB_WORKSPACE/source/src/app/api/proxy/ad/route.ts"

      # ---------- 7. 构建并推送镜像 ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./source
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest

      - name: 完成提示
        run: |
          echo "镜像已推送到："
          echo "  ${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}"
          echo "  ${{ steps.img.outputs.image }}:latest"
          echo "包含：网页去广告增强 + TVBox同款去广告 + 站长菜单 + 单终端互踢 + 终端识别 + 在线升级"
