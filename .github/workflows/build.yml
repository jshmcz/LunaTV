name: Build LunaTV Enhanced (去广告 + 站长 + TVBox同款去广告 + key防泄漏)

# 手动触发：在 Actions 页面点 Run workflow，填入要编译的版本号
on:
  workflow_dispatch:
    inputs:
      version:
        description: '官方源码版本 tag（如 5.1.8）。必须是 laboratorys/LunaTV 仓库真实存在的 tag，否则 checkout 会失败'
        required: true
        default: '5.1.8'
      image_tag:
        description: '产出镜像标签（如 5.1.8.3）。留空则与源码版本相同'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送镜像到 GHCR 需要
    steps:
      # ---------- 0. 计算小写镜像名（GHCR/Docker 不允许大写） ----------
      - name: 计算镜像名
        id: img
        run: |
          VER="${{ github.event.inputs.version }}"
          TAG="${{ github.event.inputs.image_tag }}"
          # 镜像标签留空则用源码版本；校验只含合法字符
          [ -z "$TAG" ] && TAG="$VER"
          if ! echo "$TAG" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "ERROR: 镜像标签只能包含字母、数字、点、下划线、连字符" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${OWNER}/lunatv" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "源码版本: ${VER}  镜像目标: ${{ env.REGISTRY }}/${OWNER}/lunatv:${TAG}"

      # ---------- 1. 拉取官方指定版本源码 ----------
      - name: Checkout 官方源码
        uses: actions/checkout@v5
        with:
          repository: laboratorys/LunaTV
          ref: ${{ steps.img.outputs.version }}
          path: source
          fetch-depth: 0

      # ---------- 2. 拉取本仓库的补丁 ----------
      - name: Checkout 补丁仓库
        uses: actions/checkout@v5
        with:
          path: patches

      # ---------- 3. 应用去广告补丁（网页播放） ----------
      - name: Apply adfilter patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/apply_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 4. 应用站长增强补丁 ----------
      - name: Apply owner patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/owner-patch/apply_owner_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 5. 应用 TVBox 同款去广告补丁 ----------
      - name: Apply tvbox-ad patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/tvbox-adpatch/apply_tvbox_ad_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 5b. 应用 TVBox key 防泄漏补丁 ----------
      - name: Apply tvbox-keyguard patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/tvbox-keyguard/apply_tvbox_keyguard_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 5c. 应用登录防暴破补丁（失败计数 + 一次性验证码 + 修复用户名框晚显示） ----------
      - name: Apply login-guard patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/login-guard/apply_login_guard_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 5d. 应用播放性能优化补丁（并发池测速 + 缩短超时 + 去人为延迟） ----------
      - name: Apply perf patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/perf-patch/apply_perf_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 5e. 应用全局错误提示静默补丁（默认隐藏红色错误卡片，可开关恢复） ----------
      - name: Apply ui-quiet patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/ui-quiet-patch/apply_ui_quiet_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 6. 使用增强版 Dockerfile（含 better-sqlite3 编译工具链） ----------
      - name: Prepare Dockerfile
        run: |
          cp "$GITHUB_WORKSPACE/patches/Dockerfile" "$GITHUB_WORKSPACE/source/Dockerfile"
          echo "--- 校验所有补丁符号 ---"
          grep -q "filterAdsEnhanced" "$GITHUB_WORKSPACE/source/src/lib/pcrAdFilter.ts"
          grep -q "createSession" "$GITHUB_WORKSPACE/source/src/lib/session.ts"
          grep -q "isSameDeviceReLogin" "$GITHUB_WORKSPACE/source/src/lib/session.ts"
          grep -q "effectiveSid" "$GITHUB_WORKSPACE/source/src/lib/session.ts"
          grep -q "id: 'owner'" "$GITHUB_WORKSPACE/source/src/app/admin/page.tsx"
          grep -q "filterAdsServerSide" "$GITHUB_WORKSPACE/source/src/lib/serverAdFilter.ts"
          grep -q "\[ServerAdFilter\] 启发式命中" "$GITHUB_WORKSPACE/source/src/app/api/proxy/ad/route.ts"
          grep -q "recordDeviceAndGuard" "$GITHUB_WORKSPACE/source/src/lib/tvboxKeyGuard.ts"
          grep -q "加长 key：SHA256" "$GITHUB_WORKSPACE/source/src/lib/utils.ts"
          grep -q "tvboxDeviceCount" "$GITHUB_WORKSPACE/source/src/app/api/admin/owner/overview/route.ts"
          grep -q "owner:login:fail:" "$GITHUB_WORKSPACE/source/src/lib/loginGuard.ts"
          grep -q "X-Captcha-Token" "$GITHUB_WORKSPACE/source/src/app/api/login/route.ts"
          grep -q "COOKIE_MAX_AGE" "$GITHUB_WORKSPACE/source/src/app/api/login/route.ts"
          grep -q "370 \* 24 \* 60 \* 60" "$GITHUB_WORKSPACE/source/src/lib/session.ts"
          grep -q "const { siteName, storageType, openRegister } = useSite()" "$GITHUB_WORKSPACE/source/src/app/login/page.tsx"
          grep -q "LAST_USERNAME_KEY" "$GITHUB_WORKSPACE/source/src/app/login/page.tsx"
          grep -q "storageType={storageType}" "$GITHUB_WORKSPACE/source/src/app/layout.tsx"
          grep -q "MAX_CONCURRENCY = 5" "$GITHUB_WORKSPACE/source/src/app/play/PlayPageClient.tsx"
          grep -q "}, 2500);" "$GITHUB_WORKSPACE/source/src/lib/utils.ts"
          grep -q "HIDE_GLOBAL_ERRORS" "$GITHUB_WORKSPACE/source/src/app/layout.tsx"
          grep -q "HIDE_GLOBAL_ERRORS !== false" "$GITHUB_WORKSPACE/source/src/components/GlobalErrorIndicator.tsx"

      # ---------- 7. 构建并推送镜像 ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./source
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest

      - name: 完成提示
        run: |
          echo "镜像已推送到："
          echo "  ${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}"
          echo "  ${{ steps.img.outputs.image }}:latest"
          echo "包含：网页去广告增强 + TVBox同款去广告 + 站长菜单 + 单终端互踢 + 终端识别 + 在线升级 + TVBox key 防泄漏(加长/设备数/超限轮换) + 登录防暴破(失败计数/一次性验证码/修复用户名框晚显示) + 播放性能优化(并发池测速/缩短超时/去人为延迟) + 全局错误提示静默(默认隐藏红卡片/可开关恢复)"
