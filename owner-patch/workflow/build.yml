name: Build LunaTV Enhanced (去广告 + 站长增强版)

# 手动触发：在 Actions 页面点 Run workflow，填入要编译的版本号
on:
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的 LunaTV 版本 tag（如 5.1.8）'
        required: true
        default: '5.1.8'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送镜像到 GHCR 需要
    steps:
      # ---------- 0. 计算小写镜像名（GHCR/Docker 不允许大写） ----------
      - name: 计算镜像名
        id: img
        run: |
          VER="${{ github.event.inputs.version }}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${OWNER}/lunatv" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "镜像目标: ${{ env.REGISTRY }}/${OWNER}/lunatv:${VER}"

      # ---------- 1. 拉取官方指定版本源码 ----------
      - name: Checkout 官方源码
        uses: actions/checkout@v5
        with:
          repository: laboratorys/LunaTV
          ref: ${{ steps.img.outputs.version }}
          path: source
          fetch-depth: 0

      # ---------- 2. 拉取本仓库的补丁 ----------
      - name: Checkout 补丁仓库
        uses: actions/checkout@v5
        with:
          path: patches

      # ---------- 3. 应用去广告补丁 ----------
      - name: Apply adfilter patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/apply_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 4. 应用站长增强补丁 ----------
      - name: Apply owner patch
        run: |
          bash "$GITHUB_WORKSPACE/patches/owner-patch/apply_owner_patch.sh" "$GITHUB_WORKSPACE/source"

      # ---------- 5. 使用增强版 Dockerfile（含 better-sqlite3 编译工具链） ----------
      - name: Prepare Dockerfile
        run: |
          cp "$GITHUB_WORKSPACE/patches/Dockerfile" "$GITHUB_WORKSPACE/source/Dockerfile"
          echo "--- 校验所有补丁符号 ---"
          grep -q "filterAdsEnhanced" "$GITHUB_WORKSPACE/source/src/lib/pcrAdFilter.ts"
          grep -q "createSession" "$GITHUB_WORKSPACE/source/src/lib/session.ts"
          grep -q "id: 'owner'" "$GITHUB_WORKSPACE/source/src/app/admin/page.tsx"

      # ---------- 6. 构建并推送镜像 ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./source
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.img.outputs.version }}
            ${{ steps.img.outputs.image }}:latest

      - name: 完成提示
        run: |
          echo "镜像已推送到："
          echo "  ${{ steps.img.outputs.image }}:${{ steps.img.outputs.version }}"
          echo "  ${{ steps.img.outputs.image }}:latest"
          echo "包含：去广告增强 + 站长菜单 + 单终端互踢 + 终端识别 + 在线升级"
